<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoneDay - Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <header class="header">
            <h1>DoneDay</h1>
            <p>MY DAILY TASKS</p>
        </header>

        <section class="task-card">
            <img class="product-image" src="зарядное устройство фото.jpeg" alt="charger-image">
            <h2> Phone Charger </h2>
            <p class="charger-price">7.000 KZT</p>
            <p class="product-description">A high-quality phone charger for fast charging.</p>
            <button class="complete-button">Mark as completed</button>

        </section>
    </main>
</body>
</html>
