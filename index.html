<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoneDay - Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <header class="header">
            <h1>DoneDay</h1>
            <p>MY DAILY TASKS</p>
        </header>

        <section class="task-card">
            <div class="task-info">
                <div class="task-icon">📖</div>

                <div class="task-content">
                    <h2>Study JavaScript</h2>
                    <p>Practice the basics and solve 3 exercises.</p>
                </div>
            </div>

            <div class="task-details">
                <span class="task-status">In progress</span>
                <span class="task-category">Personal development</span>
            </div>

            <button class="complete-button">
                Mark as completed
            </button>

        </section>

    </main>
</body>
</html>
